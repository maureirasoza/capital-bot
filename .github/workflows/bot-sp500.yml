name: Bot SP500 Bollinger 15m (demo)
# 4o bot, EXPERIMENTAL (19-sep-2026): reversion Bollinger 2 lados en US500, velas 15m.
# Gatillo UNICO: cron-job.org via workflow_dispatch (POST a /dispatches), cada 15 min:
# crontab '1,16,31,46 * * * *' (1 min tras cada cierre 15m). Sin 'schedule' de GitHub para
# evitar el doble disparo (race en el candado -> entradas duplicadas), igual que los otros bots.

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # solo para guardar el sentimiento en la rama datos-sentimiento
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Ejecutar bot SP500 (Bollinger 2 lados, 15m)
        env:
          CAPITAL_API_KEY:      ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER:   ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          CAPITAL_ENV: demo
          CAPITAL_ALLOW_LIVE: '0'
        run: |
          set -o pipefail
          python -u bot_sp500.py 2>&1 | tee bot.log
      # MODO SOMBRA IA (9-oct-2026): si el bot coloco una orden, Claude opina sobre esa entrada con el contexto
      # del momento (noticias). SOLO REGISTRA: la orden ya esta puesta y este paso no puede tocarla.
      - name: Modo sombra IA (solo registra, no opera)
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        env:
          CAPITAL_API_KEY:      ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER:   ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          CAPITAL_ENV: demo
          CAPITAL_ALLOW_LIVE: '0'
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          grep -qE "ORDEN (COLOCADA|LIMITE)|COLOCADA (BUY|SELL)" bot.log 2>/dev/null || { echo "sin orden en esta corrida -> sombra IA no corre"; exit 0; }
          pip install -q anthropic
          python sombra_ia.py sp500 bot.log
      - name: Guardar veredicto IA
        if: always() && hashFiles('sombra_ia.jsonl') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sombra-ia-${{ github.run_id }}
          path: sombra_ia.jsonl
          retention-days: 90
      # SENTIMIENTO DE CLIENTES (9-oct-2026): capital.com no da historico -> se guarda cada 15 min en la rama
      # 'datos-sentimiento' (sentimiento.jsonl) para probar en unas semanas si sirve como filtro. No toca la operacion.
      - name: Guardar sentimiento de clientes
        if: always()
        continue-on-error: true
        env:
          CAPITAL_API_KEY:      ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER:   ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          CAPITAL_ENV: demo
          CAPITAL_ALLOW_LIVE: '0'
          GH_TOKEN: ${{ github.token }}
        run: |
          python sentimiento_log.py > linea.json
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3; do
            rm -rf datos
            if ! git clone -q --depth 1 --branch datos-sentimiento "$URL" datos 2>/dev/null; then
              mkdir datos && git -C datos init -q && git -C datos checkout -q -b datos-sentimiento && git -C datos remote add origin "$URL"
            fi
            cat linea.json >> datos/sentimiento.jsonl
            git -C datos add sentimiento.jsonl
            git -C datos -c user.name="bot-sentimiento" -c user.email="actions@users.noreply.github.com" commit -qm "sentimiento $(date -u +%FT%TZ)"
            git -C datos push -q origin datos-sentimiento && break
            sleep 7
          done
