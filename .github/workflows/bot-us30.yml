name: Bot US30 Bollinger-RSI 15m (demo)
# 5o bot (19-sep-2026): reversion BB20/2+RSI35/65 de 2 lados en US30 (Dow), velas 15m, trailing 5xATR.
# Gatillo UNICO: cron-job.org via workflow_dispatch, crontab '1,16,31,46 * * * *' (UTC).
# Sin 'schedule' de GitHub (evita doble disparo / entradas duplicadas), igual que los otros bots.

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Ejecutar bot US30 (Bollinger+RSI 2 lados, 15m)
        env:
          CAPITAL_API_KEY:      ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER:   ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          CAPITAL_ENV: demo
          CAPITAL_ALLOW_LIVE: '0'
        run: python bot_us30.py
